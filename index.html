<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Richmond price tags</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:BUDLocal;src:local("BUD Bold"),local("BUD-Bold"),local("BUDBold"),local("BUD");font-weight:100 900}
:root{--red:#e60000;--red-d:#c40000;--ink:#17191e;--mute:#6b7079;--line:#dfe2e7;--bg:#eef0f3;--panel:#fff}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
.app{display:grid;grid-template-columns:420px 1fr;min-height:100vh}
.panel{background:var(--panel);border-right:1px solid var(--line);padding:26px 26px 0;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow:auto}
h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
h2{font-size:15px;font-weight:800;margin:0 0 12px}
.sub{margin:4px 0 0;color:var(--mute);font-size:13.5px}
.hint{font-size:12.5px;color:var(--mute);margin:6px 0 0;line-height:1.45}
input[type=text],select{font:inherit;font-weight:600;color:var(--ink);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;background:#fff;min-width:0}
input:focus,select:focus,button:focus-visible{outline:3px solid rgba(230,0,0,.25);border-color:var(--red)}
.pin{position:relative}
.pin svg{position:absolute;left:11px;top:50%;width:15px;height:13px;margin-top:-6.5px;fill:var(--mute);pointer-events:none}
.pin input{padding-left:32px}
.rows{display:flex;flex-direction:column;gap:10px}
.rowhead,.row{display:grid;grid-template-columns:1fr 1fr 104px 30px;gap:8px;align-items:center}
.rowhead{font-size:12.5px;font-weight:600;color:var(--mute)}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.step button{width:28px;height:40px;border:0;background:#fff;font-size:18px;font-weight:600;cursor:pointer;color:var(--ink)}
.step button:hover{background:var(--bg)}
.step output{min-width:26px;text-align:center;font-weight:800}
.x{border:0;background:transparent;color:var(--mute);font-size:20px;cursor:pointer;border-radius:6px;height:34px}
.x:hover{color:var(--red);background:var(--bg)}
.add{border:1.5px dashed #c3c8d0;background:transparent;border-radius:9px;padding:10px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.add:hover{border-color:var(--red);color:var(--red)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;font:inherit;font-weight:600;font-size:13.5px;padding:9px 6px;border-radius:7px;color:var(--mute);cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ctl{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;font-size:13.5px;font-weight:600;color:var(--mute);min-height:38px}
.ctl .v{color:var(--ink);font-weight:700}
.ctl input[type=range]{width:100%;accent-color:var(--red)}
.ctl input[type=color]{width:46px;height:34px;border:1.5px solid var(--line);border-radius:8px;padding:2px;background:#fff;cursor:pointer}
.ctl input[type=checkbox],.check input{width:18px;height:18px;accent-color:var(--red);margin:0}
.rng{display:flex;align-items:center;gap:10px}.rng span{min-width:58px;text-align:right;color:var(--ink);font-weight:700;font-size:13px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;cursor:pointer}
.styleBox{display:flex;flex-direction:column;gap:4px;margin-top:14px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;font:inherit;font-weight:600;font-size:12.5px;padding:6px 12px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.fontrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.ok{color:#0a7d3c}.warn{color:#a15c00}
.foot{margin-top:auto;position:sticky;bottom:0;background:var(--panel);padding:14px 0 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.count{font-size:13.5px;color:var(--mute);font-weight:600}
.print{border:0;background:var(--red);color:#fff;font:inherit;font-weight:800;font-size:15.5px;padding:14px;border-radius:11px;cursor:pointer}
.print:hover{background:var(--red-d)}
.note{font-size:12.5px;color:var(--mute);margin:0;line-height:1.5}
.stage{padding:28px 20px;overflow:auto}
.pages{display:flex;flex-direction:column;align-items:center;gap:22px;zoom:var(--z,.8)}
.sheet{width:210mm;height:297mm;background:#fff;box-shadow:0 2px 14px rgba(20,25,35,.15);padding:14.14mm 0 0 25.57mm;display:grid;grid-template-columns:76.62mm 76.62mm;grid-auto-rows:51.05mm;column-gap:5.68mm;row-gap:3.64mm;align-content:start;justify-content:start;flex:none;overflow:hidden}

<div class="app">
  <aside class="panel">
    <div>
      <h1>Richmond price tags</h1>
      <p class="sub">Add the prices, style them, then print on A4.</p>
    </div>

    <section>
      <h2>Prices</h2>
      <div class="rows">
        <div class="rowhead"><span>Was</span><span>Now</span><span>Tags</span><span></span></div>
        <div id="rows" class="rows"></div>
        <button class="add" id="add">+ Add another price</button>
      </div>
    </section>

    <section>
      <h2>Price style</h2>
      <div class="seg" id="target"><button data-t="now">Now price</button><button data-t="was">Was price</button></div>
      <div class="styleBox" id="style"></div>
      <div class="fontrow">
        <button class="chip" id="upl">Upload BUD Bold font</button>
        <button class="chip" id="rmfont" hidden>Remove uploaded font</button>
        <input type="file" id="file" accept=".ttf,.otf,.woff,.woff2" hidden>
      </div>
      <p class="hint" id="fstat"></p>
      <div class="styleBox" style="margin-top:12px">
        <label class="check"><input type="checkbox" id="fmt">Add thousands separator (1,299)</label>
        <label class="check"><input type="checkbox" id="fit">Shrink long prices to fit the box</label>
      </div>
      <button class="chip" id="reset" style="margin-top:14px">Reset style</button>
    </section>

    <div class="foot">
      <div class="count" id="count"></div>
      <button class="print" id="print">Print / Save as PDF</button>
      <p class="note">In the print dialog choose paper size A4, scale 100% (not “fit to page”) and margins None, so the tags keep their exact size. To save a PDF, pick “Save as PDF” as the destination.</p>
    </div>
  </aside>

  <main class="stage" id="stage"><div class="pages" id="pages"></div></main>
</div>

<script>
const $ = id => document.getElementById(id);
const PER_PAGE = 10, BOX_H = 17.25;
const FONTS = {
  bud:['BUD Bold','"BUDCustom","BUDLocal",Manrope,system-ui,sans-serif'],
  manrope:['Manrope','Manrope,sans-serif'],
  arial:['Arial','Arial,Helvetica,sans-serif'],
  georgia:['Georgia','Georgia,serif'],
  verdana:['Verdana','Verdana,sans-serif'],
  trebuchet:['Trebuchet MS','"Trebuchet MS",sans-serif'],
  impact:['Impact','Impact,"Arial Narrow",sans-serif'],
  courier:['Courier New','"Courier New",monospace']
};
const CONTROLS = [
  {k:'font', label:'Font', type:'select', opts:Object.entries(FONTS).map(([v,f])=>[v,f[0]])},
  {k:'size', label:'Size', type:'range', min:4, max:14, step:.1, unit:' mm'},
  {k:'weight', label:'Weight', type:'select', opts:[[400,'Regular'],[500,'Medium'],[600,'Semibold'],[700,'Bold'],[800,'Extrabold'],[900,'Black']]},
  {k:'color', label:'Color', type:'color'},
  {k:'align', label:'Alignment', type:'seg', opts:[['left','Left'],['center','Center'],['right','Right']]},
  {k:'ls', label:'Letter spacing', type:'range', min:-.05, max:.2, step:.01, unit:' em'},
  {k:'dy', label:'Vertical position', type:'range', min:-4, max:4, step:.1, unit:' mm'},
  {k:'sym', label:'Symbol size', type:'range', min:70, max:140, step:1, unit:'%'},
  {k:'strike', label:'Strike through', type:'check'}
];
const DEF = () => ({
  now:{font:'bud', size:11, weight:700, color:'#17191e', align:'center', ls:0, dy:0, sym:100, strike:false},
  was:{font:'bud', size:9, weight:700, color:'#17191e', align:'center', ls:0, dy:0, sym:100, strike:false}
});
const st = { rows:[{was:'',now:'',qty:10}], style:DEF(), target:'now', fmt:true, fit:true, customFont:null };

try { const s = JSON.parse(localStorage.getItem('rtags') || 'null'); if(s){ Object.assign(st, s); st.style = {now:{...DEF().now,...s.style?.now}, was:{...DEF().was,...s.style?.was}}; } } catch(e){}
const save = () => { try { localStorage.setItem('rtags', JSON.stringify({rows:st.rows, style:st.style, target:st.target, fmt:st.fmt, fit:st.fit})); } catch(e){} };

function fmtNum(v){
  v = (v || '').replace(/[^\d.,]/g, '');
  if(!v) return '';
  if(st.fmt){
    const n = v.replace(/,/g, '');
    if(/^\d+(\.\d*)?$/.test(n)){ const [i, d] = n.split('.'); return i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (d !== undefined ? '.' + d : ''); }
  }
  return v;
}
function priceEl(cls, raw, s){
  const d = document.createElement('div');
  d.className = 'p ' + cls;
  d.style.justifyContent = {left:'flex-start', center:'center', right:'flex-end'}[s.align];
  d.style.color = s.color; d.style.fontFamily = FONTS[s.font][1];
  d.style.fontWeight = s.weight; d.style.letterSpacing = s.ls + 'em';
  d.style.transform = `translateY(${s.dy}mm)`;
  const t = fmtNum(raw);
  if(t){
    const v = document.createElement('span');
    v.className = 'v' + (s.strike ? ' strike' : '');
    v.dataset.fs = s.size; v.style.fontSize = s.size + 'mm';
    const sw = Math.max(0, (s.weight - 500) / 100 * 12);
    v.innerHTML = `<svg class="dh" viewBox="0 0 1000 870" role="img" aria-label="UAE Dirham" style="--sym:${s.sym/100};stroke-width:${sw}"><use href="#dh"/></svg>`;
    v.append(document.createTextNode(t));
    d.append(v);
  }
  return d;
}
function fitAll(){
  document.querySelectorAll('.p .v').forEach(v => {
    let fs = +v.dataset.fs;
    if(st.fit) fs = Math.min(fs, BOX_H * .8);
    v.style.fontSize = fs + 'mm';
    if(st.fit){ const r = v.parentElement.clientWidth / v.offsetWidth; if(r < 1) v.style.fontSize = (fs * r * .96) + 'mm'; }
  });
}
function tagList(){
  const list = [];
  st.rows.forEach(r => { for(let i = 0; i < r.qty; i++) list.push(r); });
  return list;
}
function render(){
  const list = tagList();
  const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  const wrap = $('pages'); wrap.textContent = '';
  for(let p = 0; p < pages; p++){
    const sheet = document.createElement('div'); sheet.className = 'sheet';
    for(let i = 0; i < PER_PAGE; i++){
      const item = list[p * PER_PAGE + i];
      const tag = document.createElement('div');
      tag.className = 'tag' + (item ? '' : ' empty');
      if(item) tag.append(priceEl('was', item.was, st.style.was), priceEl('now', item.now, st.style.now));
      sheet.append(tag);
    }
    wrap.append(sheet);
  }
  const n = list.length;
  $('count').textContent = n + (n === 1 ? ' tag' : ' tags') + ' on ' + pages + (pages === 1 ? ' page' : ' pages');
  $('print').disabled = n === 0;
  scale(); fitAll(); save();
}
function scale(){
  const w = $('stage').clientWidth - 40;
  $('pages').style.setProperty('--z', Math.min(1, w / (210 * 3.7795)).toFixed(3));
}
const dhIcon = '<svg viewBox="0 0 1000 870"><use href="#dh"/></svg>';
function buildRows(){
  const box = $('rows'); box.textContent = '';
  st.rows.forEach((r, i) => {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<div class="pin">${dhIcon}<input type="text" inputmode="decimal" aria-label="Was price" placeholder="Was"></div><div class="pin">${dhIcon}<input type="text" inputmode="decimal" aria-label="Now price" placeholder="Now"></div>` +
      '<div class="step"><button aria-label="Fewer tags">−</button><output></output><button aria-label="More tags">+</button></div>' +
      '<button class="x" aria-label="Remove price">×</button>';
    const [w, n] = row.querySelectorAll('input'), out = row.querySelector('output'), [minus, plus] = row.querySelectorAll('.step button');
    w.value = r.was; n.value = r.now; out.textContent = r.qty;
    w.oninput = () => { r.was = w.value; render(); };
    n.oninput = () => { r.now = n.value; render(); };
    minus.onclick = () => { r.qty = Math.max(1, r.qty - 1); out.textContent = r.qty; render(); };
    plus.onclick = () => { r.qty = Math.min(100, r.qty + 1); out.textContent = r.qty; render(); };
    const x = row.querySelector('.x'); x.hidden = st.rows.length < 2;
    x.onclick = () => { st.rows.splice(i, 1); buildRows(); render(); };
    box.append(row);
  });
}
function buildStyle(){
  const s = st.style[st.target], box = $('style'); box.textContent = '';
  document.querySelectorAll('#target button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === st.target));
  CONTROLS.forEach(c => {
    const row = document.createElement('div'); row.className = 'ctl';
    const lab = document.createElement('span'); lab.textContent = c.label; row.append(lab);
    let el;
    if(c.type === 'select'){
      el = document.createElement('select');
      c.opts.forEach(([v, t]) => { const o = new Option(t, v); el.add(o); });
      el.value = s[c.k];
      el.onchange = () => { s[c.k] = c.k === 'weight' ? +el.value : el.value; render(); if(c.k === 'font') fontStatus(); };
    } else if(c.type === 'range'){
      el = document.createElement('div'); el.className = 'rng';
      const r = document.createElement('input'); Object.assign(r, {type:'range', min:c.min, max:c.max, step:c.step, value:s[c.k]});
      const o = document.createElement('span'); o.textContent = s[c.k] + c.unit;
      r.oninput = () => { s[c.k] = +r.value; o.textContent = s[c.k] + c.unit; render(); };
      el.append(r, o);
    } else if(c.type === 'color'){
      el = document.createElement('input'); el.type = 'color'; el.value = s[c.k];
      el.oninput = () => { s[c.k] = el.value; render(); };
    } else if(c.type === 'check'){
      el = document.createElement('input'); el.type = 'checkbox'; el.checked = s[c.k];
      el.onchange = () => { s[c.k] = el.checked; render(); };
    } else {
      el = document.createElement('div'); el.className = 'seg';
      c.opts.forEach(([v, t]) => {
        const b = document.createElement('button'); b.textContent = t; b.setAttribute('aria-pressed', s[c.k] === v);
        b.onclick = () => { s[c.k] = v; el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); };
        el.append(b);
      });
    }
    row.append(el); box.append(row);
  });
  fontStatus();
}
async function fontStatus(){
  const el = $('fstat'), uses = st.style.now.font === 'bud' || st.style.was.font === 'bud';
  $('rmfont').hidden = !st.customFont;
  if(!uses){ el.textContent = ''; return; }
  if(st.customFont){ el.className = 'hint ok'; el.textContent = 'Using your uploaded font: ' + st.customFont; return; }
  try { await document.fonts.load('700 20px BUDLocal'); } catch(e){}
  const c = document.createElement('canvas').getContext('2d'), t = 'Hamburgefonstiv 0123456789';
  const w = f => { c.font = '700 40px ' + f; return c.measureText(t).width; };
  const found = ['serif', 'monospace'].some(b => w('BUDLocal,' + b) !== w(b));
  el.className = 'hint ' + (found ? 'ok' : 'warn');
  el.textContent = found ? 'BUD Bold found on this computer.' : 'BUD Bold isn’t installed on this computer, so a fallback font is showing. Upload the BUD Bold font file to use it.';
}
async function useFont(url, name){
  const f = new FontFace('BUDCustom', `url(${url})`, {weight:'100 900'});
  await f.load(); document.fonts.add(f); st.customFont = name; fontStatus(); render();
}
$('upl').onclick = () => $('file').click();
$('file').onchange = e => {
  const file = e.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => { useFont(rd.result, file.name).then(() => { try { localStorage.setItem('rtags-font', JSON.stringify({name:file.name, url:rd.result})); } catch(x){} }).catch(() => { $('fstat').className = 'hint warn'; $('fstat').textContent = 'That file couldn’t be read as a font. Use a .ttf, .otf, .woff or .woff2 file.'; }); };
  rd.readAsDataURL(file); e.target.value = '';
};
$('rmfont').onclick = () => { st.customFont = null; try { localStorage.removeItem('rtags-font'); } catch(e){} location.reload(); };
$('target').onclick = e => { const b = e.target.closest('button'); if(b){ st.target = b.dataset.t; buildStyle(); save(); } };
$('add').onclick = () => { st.rows.push({was:'', now:'', qty:1}); buildRows(); render(); const i = $('rows').querySelectorAll('.row'); i[i.length - 1].querySelector('input').focus(); };
$('fmt').checked = st.fmt; $('fit').checked = st.fit;
$('fmt').onchange = e => { st.fmt = e.target.checked; render(); };
$('fit').onchange = e => { st.fit = e.target.checked; render(); };
$('reset').onclick = () => { st.style = DEF(); buildStyle(); render(); };
$('print').onclick = () => window.print();
addEventListener('resize', scale);
document.fonts.addEventListener('loadingdone', fitAll);
try { const f = JSON.parse(localStorage.getItem('rtags-font') || 'null'); if(f) useFont(f.url, f.name).catch(() => {}); } catch(e){}
buildRows(); buildStyle(); render();
</script>
</body>
</html>
